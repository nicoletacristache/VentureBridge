{% extends 'base.html' %}

{% block title %}数据已删除｜VentureBridge{% endblock %}

{% block content %}
  <div class="shell completion-page">
    <div class="completion-page__mark" aria-hidden="true">✓</div>
    <div>
      <p class="eyebrow">删除完成</p>
      <h1>学习空间及关联数据已删除</h1>
      <p class="lede">当前会话已经退出，本系统无法恢复已删除的画像、推荐、模拟和回答记录。</p>
      {% if receipt %}<p class="request-id">删除回执：<code>{{ receipt }}</code></p>{% endif %}

      <a class="button" href="{{ url_for('home') }}">返回首页</a>
    </div>
  </div>
{% endblock %}
